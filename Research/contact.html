<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · Bloom & Bean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#F5F1E8; color:#1e1a16; line-height:1.6; }
    h1,h2,h3,h4,.nav-links a,.btn { font-family:'Poppins',sans-serif; font-weight:600; }
    h2 { font-size:2.2rem; margin-bottom:0.75rem; }
    .container { max-width:1280px; margin:0 auto; padding:0 1.5rem; }
    .btn-terracotta { background:#D97941; color:#fff; border:none; padding:0.5rem 1.8rem; border-radius:60px; font-weight:600; cursor:pointer; transition:0.2s; }
    .btn-terracotta:hover { background:#c16a35; }
    header { position:sticky; top:0; z-index:100; background:#F5F1E8; box-shadow:0 2px 12px rgba(0,0,0,0.04); padding:0.75rem 0; border-bottom:1px solid rgba(60,36,21,0.08); }
    .nav-wrapper { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .logo a { font-family:'Poppins',sans-serif; font-weight:700; font-size:1.6rem; color:#3C2415; text-decoration:none; }
    .logo i { color:#8A9A8F; margin-right:6px; }
    .nav-links { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
    .nav-links a { color:#2b1d14; text-decoration:none; font-weight:500; font-size:1rem; padding:0.3rem 0; border-bottom:2px solid transparent; }
    .nav-links a:hover, .nav-links a.active { border-bottom-color:#D97941; color:#3C2415; }
    .cart-icon { font-size:1.3rem; color:#3C2415; }
    .hamburger { display:none; font-size:1.8rem; background:none; border:none; color:#3C2415; cursor:pointer; }
    .contact-grid { display:flex; flex-wrap:wrap; gap:2rem; margin:2rem 0; }
    .contact-form { flex:1; min-width:260px; }
    .contact-form input, .contact-form textarea { width:100%; padding:0.75rem 1rem; border-radius:40px; border:1px solid #d4cbbc; margin-bottom:1rem; font-family:'Inter',sans-serif; }
    .contact-form textarea { border-radius:20px; min-height:120px; }
    .contact-info { flex:1; min-width:240px; background:#8A9A8F20; border-radius:40px; padding:1.5rem; }
    .contact-info i { font-size:1.8rem; margin-right:0.5rem; }
    .whatsapp { color:#25D366; }
    footer { background:#3C2415; color:#f0e7dc; padding:2rem 0 1rem; margin-top:2.5rem; border-radius:40px 40px 0 0; }
    footer .container { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; }
    footer a { color:#e4d6c8; margin:0 0.5rem; }
    footer .social i { font-size:1.4rem; margin:0 0.3rem; }
    @media (max-width:768px) { .hamburger { display:block; } .nav-links { display:none; width:100%; flex-direction:column; align-items:start; padding:1rem 0 0.5rem; gap:0.7rem; } .nav-links.open { display:flex; } }
  </style>
</head>
<body>
<header>
  <div class="container nav-wrapper">
    <div class="logo"><a href="index.html"><i class="fas fa-seedling"></i> Bloom & Bean</a></div>
    <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="product.html">Product</a>
      <a href="subscriptions.html">Subscriptions</a>
      <a href="workshop.html">Workshop</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="functionality.html" style="background:#8A9A8F20; padding:0.2rem 1rem; border-radius:40px;">⚙️</a>
      <span class="cart-icon"><i class="fas fa-shopping-bag"></i></span>
    </nav>
  </div>
</header>
<main class="container">
  <h2>Contact & WhatsApp</h2>
  <div class="contact-grid">
    <div class="contact-form">
      <form onsubmit="alert('Message sent! (demo)'); return false;">
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Your message..."></textarea>
        <button type="submit" class="btn-terracotta">Send <i class="fas fa-paper-plane"></i></button>
      </form>
    </div>
    <div class="contact-info">
      <p><i class="fab fa-whatsapp whatsapp"></i> WhatsApp integration</p>
      <p><strong>+27 82 123 4567</strong> (click to chat)</p>
      <p style="margin-top:1rem;"><i class="fas fa-map-pin"></i> Maboneng, Johannesburg</p>
      <p><i class="fas fa-envelope"></i> hello@bloomandbean.co.za</p>
    </div>
  </div>
</main>
<footer><div class="container"><div>© 2026 Bloom & Bean · Maboneng, JHB</div><div class="social"><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fab fa-facebook"></i></a><a href="#"><i class="fab fa-twitter"></i></a></div></div></footer>
<script>
  document.getElementById('hamburger').addEventListener('click', function(){ document.getElementById('navLinks').classList.toggle('open'); });
</script>
</body>
</html>
